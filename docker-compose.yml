services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: personal_ai_dev_password
      POSTGRES_DB: personal_ai
    ports:
      - "5432:5432"
    volumes:
      - personal_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_ai_pgdata:
